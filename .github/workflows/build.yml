name: Build Windows
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go build -o teled.exe ./cmd/teled
      - uses: actions/upload-artifact@v4
        with:
          name: teled-windows
          path: teled.exe
